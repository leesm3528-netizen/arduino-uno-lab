<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" width="700" height="450"><style>text { font-family: Consolas, "D2Coding", monospace; } .k { font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; } .note { font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; font-size: 12px; font-weight: 600; fill: #2a302e; } .lbl { fill: #2a302e; font-size: 11px; } .pinlbl { fill: #ffffff; font-size: 13px; font-weight: 700; }</style><rect width="700" height="450" fill="#ffffff"></rect>
        <defs>
          <pattern id="holes" x="10" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
            <rect x="7" y="7" width="6" height="6" rx="1" fill="#b9bfbc"></rect>
          </pattern>
        </defs>

        <!-- Arduino digital header -->
        <rect x="40" y="16" width="620" height="64" rx="8" fill="#0e6874"></rect>
        <text x="56" y="40" class="pinlbl" style="font-size:12px;font-weight:500">Arduino Uno 디지털 핀</text>
        <g>
          <circle cx="140" cy="68" r="6" fill="#ffffff"></circle><text x="140" y="56" text-anchor="middle" class="pinlbl">D8</text>
          <circle cx="240" cy="68" r="6" fill="#ffffff"></circle><text x="240" y="56" text-anchor="middle" class="pinlbl">D9</text>
          <circle cx="340" cy="68" r="6" fill="#ffffff"></circle><text x="340" y="56" text-anchor="middle" class="pinlbl">D10</text>
          <circle cx="480" cy="68" r="6" fill="#ffffff"></circle><text x="480" y="56" text-anchor="middle" class="pinlbl">D2</text>
          <circle cx="620" cy="68" r="6" fill="#ffffff"></circle><text x="620" y="56" text-anchor="middle" class="pinlbl">GND</text>
        </g>

        <!-- Breadboard body -->
        <rect x="30" y="112" width="640" height="320" rx="8" fill="#f3f2ee" stroke="#c9ccca" stroke-width="1.5"></rect>
        <rect x="50" y="140" width="600" height="100" fill="url(#holes)"></rect>
        <rect x="40" y="241" width="620" height="18" fill="#e2e1dc"></rect>
        <text x="350" y="254" text-anchor="middle" class="lbl" style="font-size:10px">가운데 홈</text>
        <rect x="50" y="260" width="600" height="100" fill="url(#holes)"></rect>
        <rect x="50" y="380" width="600" height="20" fill="url(#holes)"></rect>
        <line x1="50" y1="410" x2="650" y2="410" stroke="#2f6fd0" stroke-width="2"></line>
        <text x="40" y="414" text-anchor="end" class="lbl" style="fill:#2f6fd0;font-weight:700">−</text>
        <text x="656" y="424" text-anchor="end" class="lbl" style="fill:#2f6fd0">− 레일 = GND</text>

        <!-- Row and column labels -->
        <g class="lbl" text-anchor="middle">
          <text x="40" y="154">a</text><text x="40" y="174">b</text><text x="40" y="194">c</text><text x="40" y="214">d</text><text x="40" y="234">e</text>
          <text x="40" y="274">f</text><text x="40" y="294">g</text><text x="40" y="314">h</text><text x="40" y="334">i</text><text x="40" y="354">j</text>
          <text x="140" y="132">5</text><text x="240" y="132">10</text><text x="340" y="132">15</text><text x="480" y="132">22</text><text x="520" y="132">24</text>
        </g>

        <!-- Wires from Arduino -->
        <g stroke-width="5" stroke-linecap="round">
          <line x1="140" y1="68" x2="140" y2="150" stroke="#d6453d"></line>
          <line x1="240" y1="68" x2="240" y2="150" stroke="#d9a400"></line>
          <line x1="340" y1="68" x2="340" y2="150" stroke="#2f9e5b"></line>
          <line x1="480" y1="68" x2="480" y2="150" stroke="#3b7dd8"></line>
          <line x1="620" y1="68" x2="620" y2="390" stroke="#2a302e"></line>
        </g>
        <g fill="#2a302e">
          <circle cx="140" cy="150" r="4"></circle><circle cx="240" cy="150" r="4"></circle>
          <circle cx="340" cy="150" r="4"></circle><circle cx="480" cy="150" r="4"></circle>
          <circle cx="620" cy="390" r="4"></circle>
        </g>

        <!-- LEDs across the gap: long leg (+) in row e, short leg (-) in row f -->
        <g stroke="#7a7f7d" stroke-width="2.5">
          <line x1="140" y1="230" x2="140" y2="270"></line>
          <line x1="240" y1="230" x2="240" y2="270"></line>
          <line x1="340" y1="230" x2="340" y2="270"></line>
        </g>
        <circle cx="140" cy="250" r="13" fill="#e8493f" stroke="#9b2a24" stroke-width="1.5"></circle>
        <circle cx="240" cy="250" r="13" fill="#f2c230" stroke="#9a7a10" stroke-width="1.5"></circle>
        <circle cx="340" cy="250" r="13" fill="#3fb36b" stroke="#1f6e40" stroke-width="1.5"></circle>
        <g class="lbl" style="font-weight:700">
          <text x="160" y="228">+ 긴 다리 (e5)</text>
          <text x="160" y="282">− 짧은 다리 (f5)</text>
        </g>

        <!-- Resistors: row j to GND rail -->
        <g>
          <line x1="140" y1="350" x2="140" y2="390" stroke="#7a7f7d" stroke-width="2.5"></line>
          <rect x="133" y="358" width="14" height="24" rx="5" fill="#d9b98a" stroke="#8c6d3f"></rect>
          <line x1="240" y1="350" x2="240" y2="390" stroke="#7a7f7d" stroke-width="2.5"></line>
          <rect x="233" y="358" width="14" height="24" rx="5" fill="#d9b98a" stroke="#8c6d3f"></rect>
          <line x1="340" y1="350" x2="340" y2="390" stroke="#7a7f7d" stroke-width="2.5"></line>
          <rect x="333" y="358" width="14" height="24" rx="5" fill="#d9b98a" stroke="#8c6d3f"></rect>
          <text x="160" y="374" class="lbl">220Ω (j5 → − 레일)</text>
        </g>

        <!-- 4-leg push button straddling the gap: legs e22, e24, f22, f24 -->
        <rect x="466" y="220" width="68" height="60" rx="4" fill="#3a3f3d"></rect>
        <circle cx="500" cy="250" r="15" fill="#1f2321" stroke="#5c625f" stroke-width="2"></circle>
        <circle cx="480" cy="230" r="5" fill="#3b7dd8" stroke="#ffffff" stroke-width="1.5"></circle>
        <circle cx="520" cy="230" r="4" fill="#9aa09d"></circle>
        <circle cx="480" cy="270" r="4" fill="#9aa09d"></circle>
        <circle cx="520" cy="270" r="5" fill="#2a302e" stroke="#ffffff" stroke-width="1.5"></circle>
        <text x="548" y="212" class="note">버튼 (가운데 홈 위에)</text>
        <text x="548" y="232" class="lbl">● e22 → D2 쪽</text>
        <text x="548" y="290" class="lbl">● f24 → GND 쪽</text>

        <!-- Button diagonal leg column 24: row j to GND rail -->
        <line x1="520" y1="350" x2="520" y2="390" stroke="#2a302e" stroke-width="5" stroke-linecap="round"></line>
        <circle cx="520" cy="350" r="4" fill="#2a302e"></circle>
        <circle cx="520" cy="390" r="4" fill="#2a302e"></circle>
        <text x="528" y="374" class="lbl">점퍼 (j24 → − 레일)</text>
      </svg>