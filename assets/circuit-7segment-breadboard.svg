<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" width="960" height="570"><style>text { font-family: Consolas, "D2Coding", monospace; } .k { font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; } .note { font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; font-size: 12px; font-weight: 600; fill: #2a302e; } .pin { font-size: 15px; font-weight: 700; } .seg { font-size: 16px; font-weight: 700; } .val { font-size: 12px; fill: #5b6662; } .badge { font-size: 14px; font-weight: 700; fill: #ffffff; } .ink { stroke: #1c2321; fill: none; stroke-width: 2.5; }</style><rect width="960" height="570" fill="#ffffff"></rect>
